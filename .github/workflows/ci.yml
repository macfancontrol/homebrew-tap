name: Formula
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install tap
        run: |
          brew tap macfancontrol/tap "$GITHUB_WORKSPACE"
          brew trust macfancontrol/tap 2>/dev/null || true
      - name: Build
        run: brew install --build-from-source macfancontrol/tap/macfancontrol
      - name: Test
        run: brew test macfancontrol/tap/macfancontrol
      - name: Verify the renamed tap pours its existing bottle
        run: |
          brew uninstall macfancontrol/tap/macfancontrol
          brew install --force-bottle macfancontrol/tap/macfancontrol
          brew test macfancontrol/tap/macfancontrol
      - name: Verify old repository and bottle URLs redirect
        run: |
          old=$(git ls-remote https://github.com/macfanpro/homebrew-tap.git refs/heads/main | cut -f1)
          new=$(git ls-remote https://github.com/macfancontrol/homebrew-tap.git refs/heads/main | cut -f1)
          test -n "$old" && test "$old" = "$new"
          curl --fail --location --head https://github.com/macfanpro/homebrew-tap/releases/download/macfancontrol-0.2.3.64/macfancontrol-0.2.3.64.arm64_sonoma.bottle.tar.gz
