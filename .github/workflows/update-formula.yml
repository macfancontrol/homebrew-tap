name: Update formula

# Follows MacFanControl's latest published release: points the formula at its tag,
# builds and uploads a bottle, checks that Homebrew pours it, then commits.
# Drafts are ignored, so a release is picked up only after it is published.
# Runs hourly; to update right away: gh workflow run update-formula.yml -R macfanpro/homebrew-tap
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: Optional transition tag to validate before publishing the app release
        type: string
        required: false
      force:
        description: Rebuild the bottle even if the formula is already current
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-formula
  cancel-in-progress: false

jobs:
  update:
    runs-on: macos-15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Find the latest release
        id: latest
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          tag="$REQUESTED_TAG"
          if [ -z "$tag" ]; then tag=$(gh release view -R macfanpro/macfanpro --json tagName --jq .tagName); fi
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid release tag"; exit 1; }
          version=${tag#v}
          # The renamed source layout starts with the transition release.
          if [ "$version" = "0.2.3.63" ]; then
            echo "Waiting for the MacFanControl transition release."
            echo "current=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          revision=$(gh api "repos/macfanpro/macfanpro/commits/$tag" --jq .sha)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          if grep -q "tag: \"$tag\"" Formula/macfancontrol.rb \
             && grep -q "download/macfancontrol-$version\"" Formula/macfancontrol.rb \
             && [ "${{ inputs.force }}" != "true" ]; then
            echo "Formula is already at $tag with its bottle."
            echo "current=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Point the formula at the release
        if: steps.latest.outputs.current != 'true'
        env:
          TAG: ${{ steps.latest.outputs.tag }}
          REVISION: ${{ steps.latest.outputs.revision }}
        run: |
          python3 - <<'EOF'
          import os, re
          p = "Formula/macfancontrol.rb"
          s = open(p).read()
          s = re.sub(r'tag: "v[^"]+"(?:, revision: "[0-9a-f]+")?',
                     f'tag: "{os.environ["TAG"]}", revision: "{os.environ["REVISION"]}"', s)
          # The old bottle belongs to the previous version.
          s = re.sub(r"\n  # Prebuilt for Apple Silicon;.*?\n  end\n", "", s, flags=re.S)
          open(p, "w").write(s)
          EOF
          git diff

      - name: Build the bottle
        if: steps.latest.outputs.current != 'true'
        run: |
          brew tap macfanpro/tap "$GITHUB_WORKSPACE"
          # Tapping clones the committed state; use the edited formula.
          cp Formula/macfancontrol.rb "$(brew --repo macfanpro/tap)/Formula/macfancontrol.rb"
          brew trust macfanpro/tap 2>/dev/null || true
          brew install --build-bottle macfanpro/tap/macfancontrol
          mkdir -p bottle && cd bottle
          brew bottle --json --no-rebuild \
            --root-url="https://github.com/macfanpro/homebrew-tap/releases/download/macfancontrol-${{ steps.latest.outputs.version }}" \
            macfanpro/tap/macfancontrol

      - name: Check and upload the bottle
        if: steps.latest.outputs.current != 'true'
        id: bottle
        env:
          VERSION: ${{ steps.latest.outputs.version }}
        run: |
          cd bottle
          built=$(ls macfancontrol--"$VERSION".*.bottle.tar.gz)
          # The binaries target macOS 14, so one sonoma bottle serves every later
          # macOS. Refuse to publish it if that ever stops being true.
          mkdir x && tar -xzf "$built" -C x
          for binary in x/macfancontrol/"$VERSION"/bin/macfancontrol x/macfancontrol/"$VERSION"/MacFanControl.app/Contents/MacOS/MacFanControlApp; do
            vtool -show-build "$binary" | grep -q "minos 14.0" || { echo "$binary does not target macOS 14"; exit 1; }
          done
          # Homebrew downloads GitHub-hosted bottles as name-version.tag (one dash).
          asset="macfancontrol-$VERSION.arm64_sonoma.bottle.tar.gz"
          cp "$built" "$asset"
          echo "sha256=$(shasum -a 256 "$asset" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          if gh release view "macfancontrol-$VERSION" >/dev/null 2>&1; then
            gh release upload "macfancontrol-$VERSION" "$asset" --clobber
          else
            gh release create "macfancontrol-$VERSION" "$asset" --title "macfancontrol $VERSION bottle" \
              --notes "Prebuilt Homebrew bottle for MacFanControl $VERSION (Apple Silicon, macOS 14 or later), so \`brew install macfancontrol\` needs no Xcode. Built from tag v$VERSION."
          fi
          url="https://github.com/macfanpro/homebrew-tap/releases/download/macfancontrol-$VERSION/$asset"
          for i in $(seq 60); do
            [ "$(curl -sIL -o /dev/null -w '%{http_code}' "$url")" = 200 ] && exit 0
            sleep 5
          done
          echo "Bottle is not downloadable: $url"; exit 1

      - name: Add the bottle to the formula and check that it pours
        if: steps.latest.outputs.current != 'true'
        env:
          VERSION: ${{ steps.latest.outputs.version }}
          SHA256: ${{ steps.bottle.outputs.sha256 }}
        run: |
          python3 - <<'EOF'
          import os
          p = "Formula/macfancontrol.rb"
          s = open(p).read()
          marker = "  version_scheme 1\n"
          assert marker in s and "bottle do" not in s
          v, sha = os.environ["VERSION"], os.environ["SHA256"]
          block = (
              "\n"
              "  # Prebuilt for Apple Silicon; the binaries target macOS 14, so the sonoma bottle\n"
              "  # serves every later macOS. Without it Homebrew builds from source with Xcode.\n"
              "  bottle do\n"
              f'    root_url "https://github.com/macfanpro/homebrew-tap/releases/download/macfancontrol-{v}"\n'
              f'    sha256 arm64_sonoma: "{sha}"\n'
              "  end\n"
          )
          s = s.replace(marker, marker + block)
          open(p, "w").write(s)
          EOF
          sed -n '1,20p' Formula/macfancontrol.rb
          cp Formula/macfancontrol.rb "$(brew --repo macfanpro/tap)/Formula/macfancontrol.rb"
          brew uninstall macfanpro/tap/macfancontrol
          brew install macfanpro/tap/macfancontrol 2>&1 | tee install.log
          grep -q "Pouring macfancontrol-$VERSION.arm64_sonoma.bottle.tar.gz" install.log
          brew test macfanpro/tap/macfancontrol
          test "$("$(brew --prefix macfancontrol)/bin/macfancontrol" --version)" = "$VERSION"

      - name: Verify an existing MacFanPro bottle upgrades through the old command
        if: steps.latest.outputs.current != 'true'
        env:
          VERSION: ${{ steps.latest.outputs.version }}
        run: |
          brew uninstall macfanpro/tap/macfancontrol
          tap=$(brew --repo macfanpro/tap)
          rm "$tap/Aliases/macfanpro" "$tap/formula_renames.json"
          gh api 'repos/macfanpro/homebrew-tap/contents/Formula/macfanpro.rb?ref=56d0cb9ea902f471c064246a003a84dcd3c27af8' --jq .content | base64 --decode > "$tap/Formula/macfanpro.rb"
          brew install macfanpro/tap/macfanpro
          test "$("$(brew --prefix macfanpro)/bin/macfanpro" --version)" = 0.2.3.63
          rm "$tap/Formula/macfanpro.rb"
          cp formula_renames.json "$tap/formula_renames.json"
          ln -s ../Formula/macfancontrol.rb "$tap/Aliases/macfanpro"
          HOMEBREW_NO_ASK=1 HOMEBREW_NO_AUTO_UPDATE=1 brew upgrade macfanpro
          test "$("$(brew --prefix macfanpro)/bin/macfanpro" --version)" = "$VERSION"
          test "$(brew --prefix macfanpro)" = "$(brew --prefix macfancontrol)"
          brew test macfanpro/tap/macfancontrol

      - name: Commit
        if: steps.latest.outputs.current != 'true'
        env:
          VERSION: ${{ steps.latest.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/macfancontrol.rb
          git diff --cached --quiet && { echo "No formula change."; exit 0; }
          git commit -m "Release MacFanControl $VERSION with a prebuilt bottle"
          git push
